  unit: 2
  bloom: L3
  prereqs:
  - nonloss_decomposition
  item_types:
  - mcq
  - fd
  demo_core: false
  description: Checking whether the union of projected FDs implies the original FD set.
  misconceptions:
  - MC-NF-03
  notes_ref:
    file: notes/DBMS Unit 2 Notes.pdf
    section: Dependency Preservation
- id: nf_1_2
