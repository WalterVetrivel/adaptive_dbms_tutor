# DBMS concept graph for the adaptive tutor
# Source: BE23CS405 syllabus (5 units, Bloom levels from the syllabus), unit notes in notes/, question banks in question_banks/.
# prereqs = edges (prerequisite -> concept). Validated acyclic.
# demo_core: the ~24 concepts to seed with items first for the 8-hour build.
# item_types: sql = verified by running on sample DB; fd = verified by closure code;
#             schedule = verified by precedence-graph / lock simulation code; mcq = LLM cross-check.
syllabus:
  code: BE23CS405
  title: Database Management System
  regulation: KIOT B.E./B.Tech. Regulations 2023
  textbooks:
  - Silberschatz, Korth, Sudarshan – Database System Concepts (McGraw Hill)
  - Elmasri, Navathe – Fundamentals of Database Systems (Pearson)
units:
- id: 1
  title: Introduction to Relational Database
- id: 2
  title: Database Design
- id: 3
  title: Transaction Management
- id: 4
  title: Implementation Techniques
- id: 5
  title: Advanced Topics
concepts:
- id: purpose_of_dbms
  name: Purpose of database systems
  unit: 1
  bloom: L2
  prereqs: []
  item_types:
  - mcq
  demo_core: false
  description: 'Why DBMS over file systems: redundancy, inconsistency, isolation, integrity, atomicity, concurrency, security
    problems.'
  misconceptions: []
  notes_ref:
    file: notes/DBMS Unit 1 Notes.pdf
    section: Purpose of Database System
- id: views_of_data
  name: Views of data and data abstraction
  unit: 1
  bloom: L2
  prereqs:
  - purpose_of_dbms
  item_types:
  - mcq
  demo_core: false
  description: Physical, logical and view levels; instances vs schemas; physical and logical data independence.
  misconceptions:
  - MC-ARCH-01
  notes_ref:
    file: notes/DBMS Unit 1 Notes.pdf
    section: Views of Data
- id: data_models
  name: Data models
  unit: 1
  bloom: L2
  prereqs:
  - views_of_data
  item_types:
  - mcq
  demo_core: false
  description: Relational, ER, object-based, semi-structured, hierarchical and network models; pros and cons.
  misconceptions: []
  notes_ref:
    file: notes/DBMS Unit 1 Notes.pdf
    section: Data Models
- id: db_architecture
  name: Database system architecture
  unit: 1
  bloom: L2
  prereqs:
  - views_of_data
  item_types:
  - mcq
  demo_core: false
  description: Query processor (DDL interpreter, DML compiler, query evaluation engine) and storage manager components.
  misconceptions: []
  notes_ref:
    file: notes/DBMS Unit 1 Notes.pdf
    section: Database System Architecture
- id: relational_model
  name: Relational model
  unit: 1
  bloom: L2
  prereqs:
  - data_models
  item_types:
  - mcq
  demo_core: false
  description: Relations, tuples, attributes, domains, degree and cardinality, relation schema vs instance.
  misconceptions: []
  notes_ref:
    file: notes/DBMS Unit 1 Notes.pdf
    section: Introduction to Relational Databases / Relational Model
- id: keys
  name: Keys
  unit: 1
  bloom: L3
  prereqs:
  - relational_model
  item_types:
  - mcq
  - fd
  demo_core: true
  description: Super key, candidate key, primary key, alternate key, foreign key; minimality and uniqueness.
  misconceptions:
  - MC-KEY-01
  - MC-KEY-02
  notes_ref:
    file: notes/DBMS Unit 1 Notes.pdf
    section: Keys / Domain and Key Constraint
- id: integrity_constraints
  name: Integrity constraints
  unit: 1
  bloom: L2
  prereqs:
  - keys
  item_types:
  - mcq
  - sql
  demo_core: true
  description: Domain, key, entity integrity and referential integrity rules; ON DELETE behaviour.
  misconceptions:
  - MC-KEY-03
  notes_ref:
    file: notes/DBMS Unit 1 Notes.pdf
    section: Integrity Constraints
- id: relational_algebra_basic
  name: 'Relational algebra: unary and set operations'
  unit: 1
  bloom: L3
  prereqs:
  - relational_model
  item_types:
  - mcq
  - sql
  demo_core: true
  description: Select (σ), project (π), rename (ρ), union, intersection, set difference, Cartesian product.
  misconceptions:
  - MC-RA-01
  notes_ref:
    file: notes/DBMS Unit 1 Notes.pdf
    section: Relational Algebra / Relational Operations
- id: relational_algebra_joins
  name: 'Relational algebra: joins and division'
  unit: 1
  bloom: L3
  prereqs:
  - relational_algebra_basic
  item_types:
  - mcq
  - sql
  demo_core: true
  description: Theta, equi and natural join; left, right and full outer join; division.
  misconceptions:
  - MC-RA-02
  - MC-JOIN-02
  notes_ref:
    file: notes/DBMS Unit 1 Notes.pdf
    section: Relational Algebra – Inner Join / Outer Join
- id: sql_basic_structure
  name: Basic structure of SQL queries
  unit: 1
  bloom: L3
  prereqs:
  - relational_algebra_basic
  item_types:
  - sql
  - mcq
  demo_core: true
  description: SELECT–FROM–WHERE, DISTINCT, ORDER BY, LIKE, BETWEEN, IN, NULL tests.
  misconceptions:
  - MC-NULL-01
  notes_ref:
    file: notes/DBMS Unit 1 Notes.pdf
    section: SQL Fundamentals – Select
- id: sql_ddl
  name: SQL DDL
  unit: 1
  bloom: L3
  prereqs:
  - integrity_constraints
  item_types:
  - mcq
  - sql
  demo_core: false
  description: CREATE, ALTER, DROP, TRUNCATE; NOT NULL, UNIQUE, CHECK, PRIMARY KEY, FOREIGN KEY constraints.
  misconceptions:
  - MC-SQL-01
  notes_ref:
    file: notes/DBMS Unit 1 Notes.pdf
    section: Data Definition Language
- id: sql_dml
  name: SQL DML
  unit: 1
  bloom: L3
  prereqs:
  - sql_ddl
  - sql_basic_structure
  item_types:
  - mcq
  - sql
  demo_core: false
  description: INSERT, UPDATE, DELETE; DELETE vs TRUNCATE vs DROP.
  misconceptions:
  - MC-SQL-01
  notes_ref:
    file: notes/DBMS Unit 1 Notes.pdf
    section: Data Manipulation Language
- id: er_model
