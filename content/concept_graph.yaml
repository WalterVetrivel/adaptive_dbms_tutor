  item_types:
  - mcq
  demo_core: false
  description: Mapping strong and weak entities, 1:1, 1:N and M:N relationships, multivalued attributes and generalization
    to tables.
  misconceptions:
  - MC-ER-01
  - MC-ER-02
  notes_ref:
    file: notes/DBMS Unit 2 Notes.pdf
    section: ER to Relational Mapping
- id: functional_dependencies
  name: Functional dependencies
  unit: 2
  bloom: L3
  prereqs:
  - keys
  item_types:
  - mcq
  - fd
  demo_core: true
  description: FD definition, trivial/non-trivial, Armstrong's axioms, closure of an FD set, canonical cover, extraneous attributes.
  misconceptions:
  - MC-FD-01
  - MC-FD-02
  notes_ref:
    file: notes/DBMS Unit 2 Notes.pdf
    section: Functional Dependencies
- id: closure_candidate_keys
  name: Attribute closure and finding candidate keys
  unit: 2
  bloom: L3
  prereqs:
  - functional_dependencies
  item_types:
  - fd
  demo_core: true
  description: Computing X+, testing superkeys, finding all candidate keys, prime vs non-prime attributes.
  misconceptions:
  - MC-KEY-01
  - MC-KEY-02
  notes_ref:
    file: notes/DBMS Unit 2 Notes.pdf
    section: Computing Closure Set / Concept of Super key and Candidate Key
- id: nonloss_decomposition
  name: Non-loss (lossless-join) decomposition
  unit: 2
  bloom: L3
  prereqs:
  - functional_dependencies
  item_types:
  - mcq
  - fd
  demo_core: true
  description: 'Decomposition problems; lossless test: common attributes must be a superkey of at least one side.'
  misconceptions:
  - MC-DEC-01
  notes_ref:
    file: notes/DBMS Unit 2 Notes.pdf
    section: Non-loss Decomposition or Loss-less Join
- id: dependency_preservation
