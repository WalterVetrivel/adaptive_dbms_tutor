  misconceptions:
  - MC-NF-02
  - MC-NF-04
  notes_ref:
    file: notes/DBMS Unit 2 Notes.pdf
    section: Normal Forms – First / Second Normal Form
- id: nf_3
  name: Third normal form
  unit: 2
  bloom: L3
  prereqs:
  - nf_1_2
  item_types:
  - mcq
  - fd
  demo_core: true
  description: Transitive dependencies; for X→A either X is a superkey or A is prime.
