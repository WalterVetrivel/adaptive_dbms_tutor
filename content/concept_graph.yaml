  unit: 2
  bloom: L2
  prereqs:
  - relational_model
  item_types:
  - mcq
  demo_core: false
  description: Entities, entity sets, attribute types (simple, composite, multivalued, derived), relationships, mapping cardinality.
  misconceptions: []
  notes_ref:
    file: notes/DBMS Unit 2 Notes.pdf
    section: Introduction to Entity Relationship Model
- id: er_diagrams
  name: E-R diagrams
  unit: 2
  bloom: L3
  prereqs:
  - er_model
  item_types:
  - mcq
  demo_core: false
  description: Notation, participation, weak entity sets and identifying relationships, binary vs ternary, specialization/generalization.
  misconceptions:
  - MC-ER-01
  notes_ref:
    file: notes/DBMS Unit 2 Notes.pdf
    section: ER Diagrams / Weak Entity Set
- id: er_to_relational
  name: ER-to-relational mapping
  unit: 2
  bloom: L3
  prereqs:
  - er_diagrams
